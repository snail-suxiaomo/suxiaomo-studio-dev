<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>苏小沫工作台</title>
  <style>
    :root {
      --bg: #1b1b2f;
      --fg: #e6e6f0;
      --muted: #9aa0c0;
      --accent: #8b8bf6;
      --err: #ff8a8a;
      --line: #2e3454;
    }
    * { box-sizing: border-box; }
    html, body {
      height: 100%;
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      overflow: hidden;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 28px;
    }
    .brand {
      font-size: 20px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }
    .brand .dot {
      display: inline-block;
      width: 8px; height: 8px;
      background: var(--accent);
      border-radius: 50%;
      margin-left: 8px;
      vertical-align: middle;
      animation: pulse 1.6s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.4; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.1); }
    }
    .stage {
      margin-top: 18px;
      font-size: 14px;
      color: var(--fg);
      min-height: 20px;
      text-align: center;
    }
    .detail {
      margin-top: 6px;
      font-size: 11px;
      color: var(--muted);
      min-height: 14px;
      text-align: center;
      word-break: break-all;
      max-width: 400px;
    }
    .progress {
      margin-top: 18px;
      width: 280px;
      height: 4px;
      background: var(--line);
      border-radius: 2px;
      overflow: hidden;
    }
    .progress .bar {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), #a4a4f7);
      width: 0%;
      transition: width 0.4s ease;
    }
    .progress.error .bar { background: var(--err); }
    .progress.done .bar {
      background: linear-gradient(90deg, #5ddb9a, #4ed190);
      width: 100% !important;
    }
    .stages {
      margin-top: 16px;
      font-size: 11px;
      color: var(--muted);
      display: flex;
      gap: 16px;
    }
    .stages span {
      opacity: 0.35;
      transition: opacity 0.3s;
    }
    .stages span.active {
      opacity: 1;
      color: var(--accent);
    }
    .stages span.done {
      opacity: 0.7;
      color: #5ddb9a;
    }
    button.cancel {
      margin-top: 18px;
      background: transparent;
      border: 1px solid var(--line);
      color: var(--muted);
      padding: 5px 16px;
      border-radius: 6px;
      font-size: 11px;
      cursor: pointer;
      transition: all 0.15s;
    }
    button.cancel:hover {
      border-color: var(--err);
      color: var(--err);
    }
  </style>
</head>
<body>
  <div class="brand">苏小沫工作台<span class="dot"></span></div>
  <div class="stage" id="stage">正在初始化...</div>
  <div class="detail" id="detail"></div>
  <div class="progress" id="progress"><div class="bar" id="bar"></div></div>
  <div class="stages">
    <span data-stage="init">初始化</span>
    <span data-stage="venv">依赖</span>
    <span data-stage="backend">后端</span>
    <span data-stage="frontend">前端</span>
    <span data-stage="done">完成</span>
  </div>
  <button class="cancel" id="cancelBtn">取消启动</button>

  <script>
    const stageEl = document.getElementById('stage')
    const detailEl = document.getElementById('detail')
    const progressEl = document.getElementById('progress')
    const barEl = document.getElementById('bar')
    const cancelBtn = document.getElementById('cancelBtn')
    const stageMap = { init: 0, venv: 1, backend: 2, frontend: 3, done: 4, error: 4 }

    function setStage({ stage, text, detail }) {
      stageEl.textContent = text || ''
      detailEl.textContent = detail || ''
      const idx = stageMap[stage] ?? 0
      const stages = document.querySelectorAll('.stages span')
      stages.forEach((el, i) => {
        el.classList.remove('active', 'done')
        if (i < idx) el.classList.add('done')
        else if (i === idx) el.classList.add('active')
      })
      barEl.style.width = ((idx + 1) / 5 * 100) + '%'
      progressEl.classList.remove('done', 'error')
      if (stage === 'done') progressEl.classList.add('done')
      if (stage === 'error') progressEl.classList.add('error')
    }

    if (window.electronAPI) {
      window.electronAPI.onStage(setStage)
      cancelBtn.addEventListener('click', () => window.electronAPI.cancel())
    }
  </script>
</body>
</html>
